# Move these together:
# - ksp is "<kotlin>-<ksp release>"; its prefix must equal kotlin.
# - compose-multiplatform must support this kotlin version (JetBrains' compatibility table).
# - lifecycle (org.jetbrains.androidx) must match compose-multiplatform.
# - AGP 9 is not used yet: it replaces com.android.library in KMP modules with
#   com.android.kotlin.multiplatform.library, so buildSrc needs reworking first.
# Name the full set in the commit message when bumping.
[versions]
kotlin = "2.2.21"
agp = "8.13.2"
compose-multiplatform = "1.9.3"
ksp = "2.2.21-2.0.4"
room = "2.8.4"
coroutines = "1.10.2"
lifecycle = "2.9.6"
activity-compose = "1.11.0"
navigation = "2.9.8"
androidx-test-runner = "1.6.2"
androidx-test-junit = "1.2.1"
uiautomator = "2.3.0"

[libraries]
# Gradle plugins, put on the classpath by buildSrc so every module applies them by id.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
compose-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
room-gradle-plugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
